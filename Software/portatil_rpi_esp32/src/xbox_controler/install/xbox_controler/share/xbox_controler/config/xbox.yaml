teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1  # Avanzar/Retroceder
      y: 0  # Desplazamiento lateral (Strafe)
    axis_angular:
      yaw: 3 # Giro sobre su eje
    
    scale_linear:
      x: 1.0
      y: -1.0
    scale_angular:
      yaw: -1.0

    enable_button: 5  # Botón RB de seguridad
